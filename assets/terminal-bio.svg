<svg xmlns="http://www.w3.org/2000/svg" width="960" height="224" viewBox="0 0 960 224" fill="none">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
    <style>
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .mono {
        font-family: ui-monospace, 'JetBrains Mono', 'Fira Code', SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      .cursor {
        animation: blinkCursor 1.1s infinite;
      }
    </style>
  </defs>

  <!-- Terminal Frame -->
  <rect x="8" y="8" width="944" height="208" rx="10" fill="url(#termBg)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Top Bar -->
  <path d="M8 18 C8 12.477 12.477 8 18 8 H942 C947.523 8 952 12.477 952 18 V40 H8 V18 Z" fill="#111827" />
  <line x1="8" y1="40" x2="952" y2="40" stroke="#1E293B" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="28" cy="24" r="5.5" fill="#EF4444" opacity="0.85" />
  <circle cx="46" cy="24" r="5.5" fill="#F59E0B" opacity="0.85" />
  <circle cx="64" cy="24" r="5.5" fill="#10B981" opacity="0.85" />

  <!-- Title -->
  <text x="480" y="28" text-anchor="middle" fill="#94A3B8" font-size="12" letter-spacing="0.6" class="mono">nguyen@vaa-cockpit: ~/profile — zsh</text>
  <text x="932" y="28" text-anchor="end" fill="#475569" font-size="11" class="mono">UTF-8</text>

  <!-- Terminal Body -->
  <g font-size="13.5" class="mono">
    <!-- Line 1 -->
    <text x="28" y="68" fill="#38BDF8">❯</text>
    <text x="46" y="68" fill="#E2E8F0" font-weight="600">whoami</text>
    <text x="120" y="68" fill="#64748B">--full</text>
    <text x="28" y="90" fill="#10B981">  →</text>
    <text x="60" y="90" fill="#F8FAFC">Khôi Nguyên Vũ Hoàng</text>
    <text x="242" y="90" fill="#64748B">·</text>
    <text x="256" y="90" fill="#94A3B8">Builder based in Ho Chi Minh City, Vietnam</text>

    <!-- Line 2 -->
    <text x="28" y="118" fill="#38BDF8">❯</text>
    <text x="46" y="118" fill="#E2E8F0" font-weight="600">cat</text>
    <text x="78" y="118" fill="#A78BFA">./flight-plan.json</text>

    <text x="46" y="142" fill="#64748B">{</text>
    <text x="64" y="142" fill="#38BDF8">"academy"</text><text x="142" y="142" fill="#64748B">:</text>
    <text x="156" y="142" fill="#FBBF24">"Vietnam Aviation Academy (VAA)"</text><text x="424" y="142" fill="#64748B">,</text>
    <text x="438" y="142" fill="#38BDF8">"ship"</text><text x="490" y="142" fill="#64748B">:</text>
    <text x="504" y="142" fill="#34D399">["Full-Stack Web", "AI Agents", "Security Tooling", "3D Motion"]</text>

    <text x="64" y="164" fill="#38BDF8">"workflow"</text><text x="150" y="164" fill="#64748B">:</text>
    <text x="164" y="164" fill="#E2E8F0">"Vibe-coded at speed, verified with real tests &amp; signed commits"</text>
    <text x="46" y="186" fill="#64748B">}</text>

    <!-- Prompt Cursor -->
    <text x="28" y="206" fill="#38BDF8">❯</text>
    <rect x="46" y="194" width="8.5" height="15" fill="#38BDF8" class="cursor" />
  </g>
</svg>
