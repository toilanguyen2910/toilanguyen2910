<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" fill="none">
  <defs>
    <linearGradient id="cockpitBg" x1="0" y1="0" x2="900" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070A0F" />
      <stop offset="55%" stop-color="#0B111B" />
      <stop offset="100%" stop-color="#070A0F" />
    </linearGradient>
    <linearGradient id="radarWedge" x1="153" y1="118" x2="95" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="scanTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
    <clipPath id="hudClip">
      <rect x="6" y="6" width="888" height="238" rx="10" />
    </clipPath>
    <style>
      .mono {
        font-family: ui-monospace, 'JetBrains Mono', 'Fira Code', SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      @keyframes scanMove {
        0% { transform: translateX(-200px); }
        100% { transform: translateX(1100px); }
      }
      @keyframes livePulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      .scan { animation: scanMove 6s linear infinite; }
      .pulse { animation: livePulse 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect x="6" y="6" width="888" height="238" rx="10" fill="url(#cockpitBg)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Subtle Blueprint Grid -->
  <g clip-path="url(#hudClip)" opacity="0.13">
    <path d="M0 50 H900 M0 100 H900 M0 150 H900 M0 200 H900" stroke="#38BDF8" stroke-width="0.5" stroke-dasharray="2 6" />
    <path d="M150 0 V250 M300 0 V250 M450 0 V250 M600 0 V250 M750 0 V250" stroke="#38BDF8" stroke-width="0.5" stroke-dasharray="2 6" />
  </g>

  <!-- Animated Top Laser Sweep -->
  <g clip-path="url(#hudClip)">
    <rect class="scan" x="0" y="6" width="180" height="2" fill="url(#scanTop)" />
  </g>

  <!-- Aero Corner Brackets -->
  <path d="M6 24 V6 H24" stroke="#38BDF8" stroke-width="1.8" />
  <path d="M876 6 H894 V24" stroke="#38BDF8" stroke-width="1.8" />
  <path d="M6 226 V244 H24" stroke="#38BDF8" stroke-width="1.8" />
  <path d="M876 244 H894 V226" stroke="#38BDF8" stroke-width="1.8" />

  <!-- LEFT MODULE: AVIONICS RADAR HUD -->
  <g>
    <!-- Radar Rings -->
    <circle cx="153" cy="116" r="84" stroke="#1E293B" stroke-width="1.2" fill="#06090F" fill-opacity="0.7" />
    <circle cx="153" cy="116" r="56" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.28" stroke-dasharray="3 5" />
    <circle cx="153" cy="116" r="28" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.22" />

    <!-- Crosshairs & Ticks -->
    <line x1="63" y1="116" x2="243" y2="116" stroke="#38BDF8" stroke-width="0.7" stroke-opacity="0.2" />
    <line x1="153" y1="26" x2="153" y2="206" stroke="#38BDF8" stroke-width="0.7" stroke-opacity="0.2" />
    <line x1="153" y1="28" x2="153" y2="35" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6" />
    <line x1="153" y1="197" x2="153" y2="204" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6" />
    <line x1="65" y1="116" x2="72" y2="116" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6" />
    <line x1="234" y1="116" x2="241" y2="116" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6" />

    <!-- Rotating Radar Sweep Wedge (55 deg) -->
    <g>
      <path d="M153 116 L153 33 A83 83 0 0 0 85 68 Z" fill="url(#radarWedge)" />
      <line x1="153" y1="116" x2="153" y2="33" stroke="#38BDF8" stroke-width="1.4" stroke-opacity="0.85" />
      <animateTransform attributeName="transform" type="rotate" from="0 153 116" to="360 153 116" dur="6s" repeatCount="indefinite" />
    </g>

    <!-- Target Blips -->
    <g>
      <circle cx="195" cy="80" r="3" fill="#38BDF8">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="6s" begin="0.8s" repeatCount="indefinite" />
      </circle>
      <text x="202" y="79" fill="#94A3B8" font-size="8.5" class="mono">VAA</text>

      <circle cx="110" cy="88" r="2.8" fill="#10B981">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="6s" begin="4.6s" repeatCount="indefinite" />
      </circle>
      <text x="90" y="86" fill="#94A3B8" font-size="8.5" class="mono">AI</text>

      <circle cx="182" cy="158" r="2.6" fill="#E2E8F0">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="6s" begin="2.3s" repeatCount="indefinite" />
      </circle>
      <text x="189" y="161" fill="#94A3B8" font-size="8.5" class="mono">SEC</text>
    </g>

    <!-- Center Reticle -->
    <circle cx="153" cy="116" r="3" fill="#0B111B" stroke="#38BDF8" stroke-width="1.4" />

    <!-- Heading / Coordinates -->
    <text x="153" y="20" text-anchor="middle" fill="#475569" font-size="8.5" letter-spacing="1.2" class="mono">HDG 000°</text>
    <text x="153" y="228" text-anchor="middle" fill="#64748B" font-size="9.5" letter-spacing="1" class="mono">10.82°N · 106.63°E // HCMC</text>
  </g>

  <!-- Vertical Split Divider -->
  <line x1="296" y1="22" x2="296" y2="228" stroke="#1E293B" stroke-width="1" />
  <polygon points="296,119 300,125 296,131 292,125" fill="#0B111B" stroke="#38BDF8" stroke-width="1" />

  <!-- RIGHT MODULE: FLIGHT DECK TELEMETRY -->
  <g>
    <!-- Header Bar -->
    <circle cx="326" cy="32" r="3.5" fill="#10B981" class="pulse" />
    <text x="338" y="36" fill="#F8FAFC" font-size="12" font-weight="700" letter-spacing="1.4" class="mono">CALLSIGN: NGUYEN JN</text>
    <text x="872" y="36" text-anchor="end" fill="#38BDF8" font-size="10.5" letter-spacing="1.1" class="mono">VAA-2026 // SYS.ONLINE</text>
    <line x1="318" y1="48" x2="874" y2="48" stroke="#1E293B" stroke-width="1" />

    <!-- Spec Rows -->
    <g class="mono" font-size="12.5">
      <!-- Row 1 -->
      <text x="320" y="75" fill="#64748B" font-size="10.5" letter-spacing="1.1">PILOT</text>
      <rect x="398" y="64" width="2" height="13" fill="#38BDF8" />
      <text x="412" y="75" fill="#F8FAFC" font-weight="600">Vũ Hoàng Khôi Nguyên</text>

      <!-- Row 2 -->
      <text x="320" y="103" fill="#64748B" font-size="10.5" letter-spacing="1.1">ACADEMY</text>
      <rect x="398" y="92" width="2" height="13" fill="#334155" />
      <text x="412" y="103" fill="#CBD5E1">Vietnam Aviation Academy · HCMC</text>

      <!-- Row 3 -->
      <text x="320" y="131" fill="#64748B" font-size="10.5" letter-spacing="1.1">SYSTEMS</text>
      <rect x="398" y="120" width="2" height="13" fill="#38BDF8" />
      <text x="412" y="131" fill="#E2E8F0">VAA Share · Promptfilm · BetAker · Auto Sniper</text>

      <!-- Row 4 -->
      <text x="320" y="159" fill="#64748B" font-size="10.5" letter-spacing="1.1">STACK</text>
      <rect x="398" y="148" width="2" height="13" fill="#334155" />
      <text x="412" y="159" fill="#CBD5E1">React 19 · TypeScript · Node 22 · FastAPI · Three.js</text>

      <!-- Row 5 -->
      <text x="320" y="187" fill="#64748B" font-size="10.5" letter-spacing="1.1">AGENTS</text>
      <rect x="398" y="176" width="2" height="13" fill="#10B981" />
      <text x="412" y="187" fill="#94A3B8">Claude Code · Codex CLI · Gemini CLI</text>
    </g>

    <!-- Bottom Telemetry Visualizer -->
    <line x1="318" y1="204" x2="874" y2="204" stroke="#1E293B" stroke-width="1" />

    <!-- Animated Signal Bars (anchored upward from y=229) -->
    <g fill="#38BDF8">
      <rect x="320" y="217" width="4" height="12" rx="1" opacity="0.5"><animate attributeName="height" values="4;14;6;12;4" dur="1.8s" repeatCount="indefinite" /><animate attributeName="y" values="225;215;223;217;225" dur="1.8s" repeatCount="indefinite" /></rect>
      <rect x="327" y="214" width="4" height="15" rx="1" opacity="0.75"><animate attributeName="height" values="14;5;16;8;14" dur="1.5s" repeatCount="indefinite" /><animate attributeName="y" values="215;224;213;221;215" dur="1.5s" repeatCount="indefinite" /></rect>
      <rect x="334" y="219" width="4" height="10" rx="1" opacity="0.45"><animate attributeName="height" values="6;15;4;11;6" dur="2.1s" repeatCount="indefinite" /><animate attributeName="y" values="223;214;225;218;223" dur="2.1s" repeatCount="indefinite" /></rect>
      <rect x="341" y="213" width="4" height="16" rx="1" opacity="0.9"><animate attributeName="height" values="16;7;14;5;16" dur="1.6s" repeatCount="indefinite" /><animate attributeName="y" values="213;222;215;224;213" dur="1.6s" repeatCount="indefinite" /></rect>
      <rect x="348" y="218" width="4" height="11" rx="1" opacity="0.6"><animate attributeName="height" values="8;13;5;15;8" dur="1.9s" repeatCount="indefinite" /><animate attributeName="y" values="221;216;224;214;221" dur="1.9s" repeatCount="indefinite" /></rect>
      <rect x="355" y="215" width="4" height="14" rx="1" opacity="0.8"><animate attributeName="height" values="12;4;15;9;12" dur="1.4s" repeatCount="indefinite" /><animate attributeName="y" values="217;225;214;220;217" dur="1.4s" repeatCount="indefinite" /></rect>
      <rect x="362" y="220" width="4" height="9" rx="1" opacity="0.4"><animate attributeName="height" values="5;12;7;14;5" dur="2.0s" repeatCount="indefinite" /><animate attributeName="y" values="224;217;222;215;224" dur="2.0s" repeatCount="indefinite" /></rect>
      <rect x="369" y="214" width="4" height="15" rx="1" opacity="0.7"><animate attributeName="height" values="15;6;13;8;15" dur="1.7s" repeatCount="indefinite" /><animate attributeName="y" values="214;223;216;221;214" dur="1.7s" repeatCount="indefinite" /></rect>
      <rect x="376" y="217" width="4" height="12" rx="1" opacity="0.55"><animate attributeName="height" values="9;16;5;11;9" dur="1.55s" repeatCount="indefinite" /><animate attributeName="y" values="220;213;224;218;220" dur="1.55s" repeatCount="indefinite" /></rect>
      <rect x="383" y="221" width="4" height="8" rx="1" opacity="0.35"><animate attributeName="height" values="4;11;8;13;4" dur="2.2s" repeatCount="indefinite" /><animate attributeName="y" values="225;218;221;216;225" dur="2.2s" repeatCount="indefinite" /></rect>
      <rect x="390" y="215" width="4" height="14" rx="1" opacity="0.65"><animate attributeName="height" values="13;6;15;7;13" dur="1.65s" repeatCount="indefinite" /><animate attributeName="y" values="216;223;214;222;216" dur="1.65s" repeatCount="indefinite" /></rect>
      <rect x="397" y="218" width="4" height="11" rx="1" opacity="0.5"><animate attributeName="height" values="7;14;6;12;7" dur="1.85s" repeatCount="indefinite" /><animate attributeName="y" values="222;215;223;217;222" dur="1.85s" repeatCount="indefinite" /></rect>
    </g>

    <text x="412" y="226" fill="#64748B" font-size="9.5" letter-spacing="0.8" class="mono">LINK: ACTIVE</text>
    <text x="872" y="226" text-anchor="end" fill="#94A3B8" font-size="9.8" letter-spacing="0.9" class="mono">VIBE-CODED + VERIFIED // SIGNED COMMITS</text>
  </g>
</svg>
