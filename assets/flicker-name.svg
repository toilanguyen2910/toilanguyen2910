<svg xmlns="http://www.w3.org/2000/svg" width="960" height="150" viewBox="0 0 960 150">
  <defs>
    <!-- Import font Nabla từ Google Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nabla&amp;display=swap');

      @keyframes flicker {
        /* ── Sáng ổn định ── */
        0%    { opacity: 1; }
        18%   { opacity: 1; }

        /* ── Chập chờn lần 1 ── */
        19%   { opacity: 0.1; }
        20%   { opacity: 1; }
        21%   { opacity: 0; }
        22%   { opacity: 0.5; }
        23%   { opacity: 1; }

        /* ── Dừng — sáng ổn định ── */
        24%   { opacity: 1; }
        52%   { opacity: 1; }

        /* ── Chập chờn lần 2 ── */
        53%   { opacity: 0; }
        54%   { opacity: 0.4; }
        55%   { opacity: 0; }
        56%   { opacity: 1; }
        57%   { opacity: 0.1; }
        58%   { opacity: 1; }

        /* ── Dừng — sáng ổn định đến hết chu kỳ ── */
        59%   { opacity: 1; }
        100%  { opacity: 1; }
      }

      .text-container {
        font-family: 'Nabla', system-ui, sans-serif;
        font-size: 60px;
        /* Ép toàn bộ hệ màu của font Nabla về màu trắng bạc cực sáng bằng SVG filter */
        filter: url(#pure-white-filter);
      }

      .static {
        opacity: 0.6; /* Làm cụm MY NAME IS tối màu hơn NGUYEN một chút để tạo điểm nhấn */
      }

      .flicker {
        animation: flicker 4s infinite;
      }
    </style>

    <!-- Filter ma trận màu ép mọi kênh màu về giá trị trắng sáng và xám bạc -->
    <filter id="pure-white-filter">
      <feColorMatrix type="matrix" values="
        0 1 1 0 1
        1 0 1 0 1
        1 1 0 0 1
        0 0 0 1 0" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="transparent" />

  <text x="480" y="80" dominant-baseline="middle" text-anchor="middle" class="text-container">
    <tspan class="static">MY NAME IS </tspan><tspan class="flicker">NGUYEN</tspan>
  </text>
</svg>
