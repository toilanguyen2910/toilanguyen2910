<svg xmlns="http://www.w3.org/2000/svg" width="960" height="116" viewBox="0 0 960 116" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="960" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070A0F" />
      <stop offset="50%" stop-color="#0C121C" />
      <stop offset="100%" stop-color="#070A0F" />
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
    <clipPath id="panelClip">
      <rect x="8" y="8" width="944" height="100" rx="8" />
    </clipPath>
    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 1; r: 4; }
        50% { opacity: 0.35; r: 3; }
      }
      @keyframes scanSweep {
        0% { transform: translateX(-220px); }
        100% { transform: translateX(1180px); }
      }
      .mono {
        font-family: ui-monospace, 'JetBrains Mono', 'Fira Code', SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif;
      }
      .dot-live {
        animation: pulseDot 2.2s ease-in-out infinite;
      }
      .scanline {
        animation: scanSweep 5.5s linear infinite;
      }
    </style>
  </defs>

  <!-- Base HUD Panel -->
  <rect x="8" y="8" width="944" height="100" rx="8" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1" />

  <!-- Subtle Grid Pattern -->
  <g clip-path="url(#panelClip)" opacity="0.14">
    <path d="M0 32 H960 M0 56 H960 M0 80 H960" stroke="#38BDF8" stroke-width="0.5" stroke-dasharray="2 6" />
    <path d="M160 0 V116 M320 0 V116 M480 0 V116 M640 0 V116 M800 0 V116" stroke="#38BDF8" stroke-width="0.5" stroke-dasharray="2 6" />
  </g>

  <!-- Animated Top Scan Beam -->
  <g clip-path="url(#panelClip)">
    <rect class="scanline" x="0" y="8" width="180" height="2" fill="url(#scanGrad)" />
  </g>

  <!-- Aero Corner Brackets -->
  <path d="M8 24 V8 H24" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="square" />
  <path d="M936 8 H952 V24" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="square" />
  <path d="M8 92 V108 H24" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="square" />
  <path d="M936 108 H952 V92" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="square" />

  <!-- Top Telemetry Row -->
  <circle cx="32" cy="31" r="4" fill="#10B981" class="dot-live" />
  <text x="44" y="35" fill="#10B981" font-size="11" font-weight="600" letter-spacing="1.4" class="mono">SYS.ONLINE // HCMC · VN</text>

  <text x="932" y="35" text-anchor="end" fill="#64748B" font-size="11" letter-spacing="1.2" class="mono">CALLSIGN: NGUYEN_JN  |  VAA-2026</text>

  <!-- Center Identity -->
  <text x="480" y="65" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="700" letter-spacing="1.5" class="sans">KHÔI NGUYÊN VŨ HOÀNG</text>

  <!-- Bottom Telemetry Pills -->
  <g transform="translate(0, 82)">
    <rect x="148" y="0" width="210" height="18" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <text x="253" y="12.5" text-anchor="middle" fill="#38BDF8" font-size="10" letter-spacing="0.8" class="mono">FULL-STACK &amp; AI TOOLING</text>

    <rect x="375" y="0" width="210" height="18" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <text x="480" y="12.5" text-anchor="middle" fill="#CBD5E1" font-size="10" letter-spacing="0.8" class="mono">VIETNAM AVIATION ACADEMY</text>

    <rect x="602" y="0" width="210" height="18" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <text x="707" y="12.5" text-anchor="middle" fill="#A78BFA" font-size="10" letter-spacing="0.8" class="mono">SECURITY · AGENTS · 3D</text>
  </g>
</svg>
